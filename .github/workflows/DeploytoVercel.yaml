name: Vercel Deploy & Rollback

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action: deploy or rollback'
        required: true
        default: 'deploy'
      version:
        description: 'Semantic version (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy \
            --prod \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID")
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Extract Deployment ID
        id: extract
        run: |
          DEPLOYMENT_URL=${{ steps.deploy.outputs.deployment_url }}
          DEPLOYMENT_ID=$(echo $DEPLOYMENT_URL | sed 's/.*-//;s/.vercel.app//')
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Update version mapping
        run: |
          VERSION=${{ github.event.inputs.version }}
          DEPLOYMENT_ID=${{ steps.extract.outputs.deployment_id }}

          if [ ! -f version-map.json ]; then echo "{}" > version-map.json; fi
          jq ".\"$VERSION\" = \"$DEPLOYMENT_ID\"" version-map.json > tmp.json && mv tmp.json version-map.json

          git add version-map.json
          git commit -m "Update mapping for $VERSION"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Alias custom domain to new deployment
        run: |
          vercel alias set ${{ steps.extract.outputs.deployment_id }} delightdavid.online \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"

  rollback:
    if: ${{ github.event.inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read version mapping
        id: read
        run: |
          VERSION=${{ github.event.inputs.version }}
          DEPLOYMENT_ID=$(jq -r ".\"$VERSION\"" version-map.json)
          if [ "$DEPLOYMENT_ID" == "null" ]; then
            echo "Version $VERSION not found in version-map.json"
            exit 1
          fi
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Alias custom domain to rollback deployment
        run: |
          vercel alias set ${{ steps.read.outputs.deployment_id }} delightdavid.online \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"
