name: Deploy to Vercel

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set ref to input tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git fetch --tags
          git checkout ${{ github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Verify Vercel CLI
        run: vercel --version

      - name: Remove stale Vercel configuration
        run: |
          rm -rf web/static/.vercel
          rm -rf .vercel

      - name: Verify Vercel authentication
        run: |
          vercel whoami --token="$VERCEL_TOKEN"

      - name: Link Vercel project
        working-directory: web/static
        run: |
          vercel link \
            --yes \
            --project="$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"

      - name: Pull Vercel project configuration
        working-directory: web/static
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"

      - name: Build Vercel project
        working-directory: web/static
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"

      - name: Deploy to Vercel
        working-directory: web/static
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"

