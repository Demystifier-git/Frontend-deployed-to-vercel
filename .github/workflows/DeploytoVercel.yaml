name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to deploy (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version from workflow input
        run: |
          echo "Deploying version ${{ github.event.inputs.version }}"
          git tag ${{ github.event.inputs.version }}
          git checkout ${{ github.event.inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Verify Vercel authentication
        run: vercel whoami --token="$VERCEL_TOKEN"

      - name: Remove stale Vercel configuration
        run: |
          rm -rf .vercel
          rm -rf web/static/.vercel

      - name: Link Vercel project
        run: |
          vercel link \
            --yes \
            --project="$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"

      - name: Deploy static website
        run: |
          vercel deploy \
            --prod \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"
